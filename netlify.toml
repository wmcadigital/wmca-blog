[build]
  # Build command for Next.js
  command = "npm run next:build"
  # Output directory for Netlify
  publish = ".next"

# Environment variables
[env.production]
  NODE_ENV = "production"

# Functions configuration
[functions]
  node_bundler = "esbuild"
  included_files = [".env.local"]

# Context-specific builds
[context.production]
  command = "npm run next:build"

[context.deploy-preview]
  command = "npm run next:build"

# Cache headers for Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ISR revalidation
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

