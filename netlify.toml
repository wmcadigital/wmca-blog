# Use Netlify's official Next.js plugin for proper runtime support
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run next:build"
  # Don't set publish - plugin handles this
  functions = "netlify/functions"

[env.production]
  NODE_ENV = "production"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=60, stale-while-revalidate=86400"



