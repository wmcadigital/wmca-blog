# Next.js static export configuration for Netlify

[build]
  command = "npm run next:build"
  publish = "out"

[env.production]
  NODE_ENV = "production"

# Static file caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"



